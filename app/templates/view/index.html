{% extends "base.html" %}
{% block title %}QRの閲覧 | 意思の記録{% endblock %}
{% block extra_head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/morishita.css') }}">
{% endblock %}
{% block content %}
  <div class="sensitive" id="viewer" data-share-id="{{ share_id }}">
    <h1>共有の閲覧</h1>
    <p>復号はこの端末の中で行います。ページの再読み込みでは、閲覧の絶対期限は延長されません。</p>
    <p id="status" role="status" aria-live="polite">準備しています。</p>
    <pre id="output"></pre>
    <button id="end" type="button">閲覧を終了</button>
  </div>
  <script type="module" src="{{ url_for('static', filename='js/watashi/view.mjs') }}"></script>
{% endblock %}
