<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコード表示</title>
</head>
<body>
    <main>
        <h1>QRコード共有</h1>
        <p>共有する内容と期限を確認してから、相手にQRコードを共有してください。</p>
        <p>QRコードには共有用の情報が含まれます。信頼できる相手にだけ共有し、公開の場所には表示しないでください。</p>
        <p id="status" role="status" aria-live="polite">QRコードの作成画面との連携は準備中です。</p>
        <div id="qrcode" aria-label="作成したQRコード"></div>
    </main>
</body>
</html>
