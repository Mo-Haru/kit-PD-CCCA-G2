{% extends "base.html" %}
{% block title %}家族共有 | 意思の記録{% endblock %}
{% block extra_head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/morishita.css') }}">
{% endblock %}
{% block content %}
  <div class="sensitive">
    <h1>家族共有</h1>
    <p>回答の保存は共有を更新しません。共有するときは、相手と項目を確認してから確定します。</p>
    <p id="status" role="status" aria-live="polite"></p>
    <h2>招待</h2>
    <button id="invite-open" type="button">リンクで招待する</button>
    <p id="invite-link" class="secret-link"></p>
    <button id="accept-open" type="button">このリンクで参加を申請する</button>
    <ul id="incoming"></ul>
    <h2>接続</h2>
    <ul id="connections"></ul>
    <h2>共有を作る</h2>
    <label for="connection">相手</label>
    <select id="connection"></select>
    <label for="item-ids">共有する項目ID（カンマ区切り）</label>
    <input id="item-ids" name="item-ids" autocomplete="off">
    <label><input id="confirm-share" type="checkbox"> 選択した項目だけを、この相手へ共有することを確認しました</label>
    <button id="share" type="button">共有を確定</button>
    <h2>自分が共有したもの</h2>
    <ul id="shares"></ul>
    <h2>受け取ったもの</h2>
    <ul id="received"></ul>
  </div>
  <script type="module" src="{{ url_for('static', filename='js/watashi/family.mjs') }}"></script>
{% endblock %}
