<section id="confirmation-output" class="demo-notice" aria-labelledby="confirmation-title" hidden>

  <p>招待した方がこの確認リンク（QRコード）を開くか、確認コードを入力すると、家族として登録されます。表示名だけでは登録されません。</p>
  <p>確認コード: <strong id="confirmation-code" class="confirmation-code"></strong></p>
  <img id="confirmation-qr" alt="招待した方へ渡す確認用QRコード">

  <button id="copy-confirmation" type="button">確認リンクをコピー</button>
  <p id="confirmation-expiry" class="note"></p>
  <p class="note">対面や電話など、相手本人と確かめられる方法で渡してください。招待した方以外には見せないでください。この画面を閉じた後は、家族画面で確認コードを再発行できます（前のコードとリンクは使えなくなります）。</p>
</section>
