{% macro icon(name, class_name="nav-icon") -%}
<svg class="{{ class_name }}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == "menu" %}
    <path class="menu-line menu-line-top" d="M3 6h18"></path>
    <path class="menu-line menu-line-middle" d="M3 12h18"></path>
    <path class="menu-line menu-line-bottom" d="M3 18h18"></path>
  {% elif name == "close" %}
    <path d="m6 6 12 12M18 6 6 18"></path>
  {% elif name == "home" %}
    <path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"></path>
  {% elif name == "answers" %}
    <rect x="5" y="3" width="14" height="18" rx="2"></rect>
    <path d="M8 7h8M8 11h8M8 15h5"></path>
  {% elif name == "sharing" %}
    <circle cx="18" cy="5" r="3"></circle>
    <circle cx="6" cy="12" r="3"></circle>
    <circle cx="18" cy="19" r="3"></circle>
    <path d="m8.6 10.5 6.8-4m-6.8 7 6.8 4"></path>
  {% elif name == "family" %}
    <circle cx="9" cy="8" r="3"></circle>
    <path d="M2 21v-2a7 7 0 0 1 14 0v2M16 5a3 3 0 0 1 0 6m6 10v-2a7 7 0 0 0-4-6.3"></path>
  {% elif name == "transfer" %}
    <path d="M4 7h15m-4-4 4 4-4 4m5 6H5m4-4-4 4 4 4"></path>
  {% elif name == "health" %}
    <path d="M3 12h4l3-7 4 14 3-7h4"></path>
  {% endif %}
</svg>
{%- endmacro %}
